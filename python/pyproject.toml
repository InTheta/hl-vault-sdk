[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hl-vault-sdk"
version = "0.1.0"
description = "Python client for public Omni Hyperliquid strategy vaults"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "InTheta" }]
dependencies = [
  "eth-account>=0.13.7,<1",
  "httpx>=0.28,<1",
  "websockets>=15,<16",
]

[project.optional-dependencies]
evm = ["web3>=7.13,<8"]
dev = [
  "build>=1.2,<2",
  "jsonschema>=4.25,<5",
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "pyyaml>=6,<7",
  "ruff>=0.11,<1",
]

[project.urls]
Repository = "https://github.com/InTheta/hl-vault-sdk"
Documentation = "https://github.com/InTheta/hl-vault-sdk/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["hl_vault_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
